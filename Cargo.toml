[package]
name = "herdr_theme-switcher"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = { version = "0.30", features = ["all-widgets"] }
crossterm = { version = "0.28", features = ["event-stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
toml_edit = "0.25.17"
chrono = "0.4.45"

[profile.release]
strip = true

[profile.dev]
debug = false
incremental = false

[profile.test]
debug = false
incremental = false

